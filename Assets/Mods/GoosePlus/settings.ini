; GoosePlus 配置 - 修改后重启鹅生效（皮肤/幽灵鹅数量可实时切换）
; 小伙伴群默认关闭（0 只）。想开就在托盘菜单「小伙伴数量」里选。
GhostCount=0
GhostScale=0.75
CompanionKind=Mix
Skin=Classic
Rainbow=False
RainbowSpeed=22.0

; 让鹅偶尔叼一张便签来搭话（"我今天想你了" 之类）。
; 文案在 Messages\Idle\*.txt，一个文件一条，默认 118 条（首次运行自动写出）。
; 只在没有专注任务时出现。改条数重启生效，最多同步 130 条。
IdleChat=True

; 番茄钟。专注 -> 短休，交替若干轮后接一次长休。
; 开局是待机状态，不会自动开始。点托盘菜单的「开始」，或按 Ctrl+Alt+T。
PomodoroEnabled=True
PomodoroFocusMinutes=25
PomodoroShortBreakMinutes=5
PomodoroLongBreakMinutes=15
PomodoroRoundsBeforeLongBreak=4

; 休息开始时让鹅叼一张便签到你面前（会临时借用游戏自带的便签目录，用完自动还原）
PomodoroNotepad=True
; 专注期让鹅安静：不发声，也不弹表情包/便签窗。鹅照常在屏幕上走动。
PomodoroQuietFocus=True
; 专注期额外不让鹅抢鼠标。★ 默认关闭 —— 开了之后「在鹅身上点一下它就来抢鼠标」
; 会完全失效，而且看不出来（鹅照常走动）。想要彻底安静再打开。
PomodoroQuietMouse=False

; 叼东西的冷却间隔（分钟）。鹅叼完一张便签/表情包之后，这段时间内不会再叼同类。
; 原版没有任何节流，连着叼两张是常事；这两个键就是给鹅的"手速"加个上限。
; 0 = 不限制。文本和图片分开设：便签是搭话，表情包是整活，节奏不一样。
; 番茄钟休息时叼的那张便签是直接投递的，不受这里限制。
DragNotepadMinutes=15
DragMemeMinutes=20

; 旧键，等同于 PomodoroFocusMinutes，保留只为兼容老配置
PomodoroMinutes=25
